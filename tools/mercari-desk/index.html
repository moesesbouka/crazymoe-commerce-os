<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Mercari listing desk · Crazy Moe’s</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f4ef;color:#163633;font:16px/1.5 system-ui,sans-serif}header{background:#143a35;color:white;padding:22px max(5vw,20px);font-weight:750}main{max-width:1100px;margin:40px auto;padding:0 20px}h1{font:normal clamp(34px,5vw,56px)/1.1 Georgia;margin:0 0 20px}form,.line{display:flex;gap:8px}input,textarea,button,select,a.action{font:inherit;border-radius:8px;padding:10px 12px}input,textarea,select{width:100%;border:1px solid #a9bbb3;background:white}textarea{min-height:140px}button,a.action{cursor:pointer;border:0;background:#17594e;color:white;text-decoration:none}button:hover,a.action:hover{background:#0d433a}section{margin-top:24px;background:white;border-radius:14px;padding:20px}label{display:block;font-weight:650;margin:12px 0 4px}.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:8px}.result{text-align:left;background:#e3eee7;color:#173d34}.result:hover{background:#cee2d5}#photos{display:flex;gap:7px;overflow:auto}#photos img{height:85px;width:85px;object-fit:cover;border-radius:7px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.action{display:inline-block;margin-top:16px}small{color:#4c665c}
</style><header>Crazy Moe’s &nbsp; / &nbsp; Inventory</header><main><h1>Mercari listing desk</h1><form id="lookup"><input id="query" aria-label="Inventory search" placeholder="Product name or Facebook Marketplace link"><button>Search</button></form><p id="status" role="status"></p><div id="results" class="results"></div><section id="editor" hidden><h2 id="name"></h2><p id="seen"></p><div id="photos"></div><div id="fields"></div><p id="note" role="status"></p><a class="action" href="https://www.mercari.com/sell/" target="_blank" rel="noopener noreferrer">Open Mercari listing form ↗</a></section></main><script>
const el=id=>document.getElementById(id);
const columns={title:'Title',description:'Description',price:'Mercari price ($)',condition:'Condition',category:'Mercari category',brand:'Brand',weight:'Packed weight',dimensions:'Packed dimensions',shipping:'Shipping method and payer'};
let selected=null, request=0;
function draftKey(id){return 'mercari-desk-v1:'+id}
function save(){try{const fields=Object.fromEntries(Object.keys(columns).map(k=>[k,el(k).value]));localStorage.setItem(draftKey(selected.facebook_id),JSON.stringify(fields));el('note').textContent='Draft saved in this browser.'}catch{el('note').textContent='Browser storage unavailable. Copy your edits before leaving.'}}
function render(row){
selected=row;let saved={};try{saved=JSON.parse(localStorage.getItem(draftKey(row.facebook_id)))||{}}catch{}
el('editor').hidden=false;el('name').textContent=row.title;el('seen').textContent='Source updated '+new Date(row.updated_at).toLocaleDateString()+'. Confirm the item is available and can ship before listing.';
el('photos').replaceChildren();for(const url of (row.images||[]).filter(v=>typeof v==='string'&&/^https:\/\//i.test(v)).slice(0,12)){const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noreferrer';const img=document.createElement('img');img.src=url;img.alt='Open source photo';img.referrerPolicy='no-referrer';a.append(img);el('photos').append(a)}
el('fields').replaceChildren();el('note').textContent='Use photos of the actual item. Check the package details and remove local pickup instructions before posting.';
for(const [k,label] of Object.entries(columns)){const l=document.createElement('label');l.htmlFor=k;l.textContent=label;const group=document.createElement('div');group.className='line';const field=document.createElement(k==='description'?'textarea':'input');field.id=k;field.value=saved[k]??row[k]??'';if(k==='price'){field.type='number';field.min='1';field.step='0.01'}field.oninput=save;const b=document.createElement('button');b.textContent='Copy';b.setAttribute('aria-label','Copy '+label);b.onclick=async()=>{try{await navigator.clipboard.writeText(field.value);el('note').textContent=label+' copied.'}catch{field.focus();field.select();el('note').textContent='Selected for copying.'}};group.append(field,b);el('fields').append(l,group)}
el('editor').scrollIntoView({block:'start'})}
el('lookup').onsubmit=async event=>{event.preventDefault();const ticket=++request;el('editor').hidden=true;el('results').replaceChildren();el('status').textContent='Searching inventory…';let term=el('query').value.trim();const id=term.match(/^(?:https?:\/\/(?:www\.|m\.)?facebook\.com\/marketplace\/item\/)?(\d{6,})(?:\/?(?:\?.*)?)$/i);const p=new URLSearchParams({select:'facebook_id,title,description,price,condition,images,category,updated_at',order:'updated_at.desc,facebook_id.asc',limit:'25'});if(id)p.set('facebook_id','eq.'+id[1]);else if(term)p.set('title','ilike.*'+term.replace(/[%_*\\]/g,' ')+'*');
try{const res=await fetch('https://sfheqjnxlkygjfohoybo.supabase.co/rest/v1/public_listings?'+p,{headers:{apikey:'sb_publishable_xfIVDlnktUiJYm5U_1jEtw_Res600Af'}});if(!res.ok)throw Error();const rows=await res.json();if(ticket!==request)return;el('status').textContent=rows.length===25?'Showing the first 25 matches. Refine your search for more.':rows.length+' matching listings';for(const r of rows){const b=document.createElement('button');b.className='result';b.textContent=r.title+' · $'+r.price;b.onclick=()=>render(r);el('results').append(b)}if(rows.length===1)render(rows[0])}catch{if(ticket===request)el('status').textContent='Catalog unavailable. Try searching again.'}};
el('lookup').requestSubmit();
</script></html>
